<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indy7 Studio View Guide</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #b9bbb8;
      --panel: rgba(255, 255, 255, 0.42);
      --line: rgba(68, 74, 72, 0.18);
      --text: #202524;
      --muted: #59615f;
      --green: #20a963;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 38% 18%, rgba(255,255,255,0.65), transparent 42%),
        linear-gradient(180deg, #d8d8d5, #9ea19d);
      color: var(--text);
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 620px;
      overflow: hidden;
    }

    .scene {
      width: 100%;
      height: 100%;
    }

    .scene img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bar {
      position: absolute;
      left: 30px;
      right: 30px;
      top: 26px;
      min-height: 64px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 20px;
      box-shadow: 0 22px 70px rgba(30, 32, 30, 0.18);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand strong {
      font-size: clamp(22px, 2.4vw, 34px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .brand span {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .pills {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      border: 1px solid rgba(57, 65, 63, 0.16);
      background: rgba(255,255,255,0.42);
      color: #4f5755;
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 850;
    }

    .pill.on {
      color: #123d28;
      border-color: rgba(32, 169, 99, 0.35);
      background: rgba(124, 226, 168, 0.38);
    }

    .caption {
      position: absolute;
      left: 30px;
      bottom: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      padding: 14px 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      box-shadow: 0 20px 54px rgba(30, 32, 30, 0.16);
    }

    @media (max-width: 860px) {
      body {
        overflow: auto;
      }

      .shell {
        height: auto;
        min-height: 100vh;
      }

      .scene {
        height: 72vh;
        min-height: 480px;
      }

      .bar {
        position: static;
        margin: 16px;
        align-items: flex-start;
        flex-direction: column;
      }

      .caption {
        position: static;
        margin: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="scene" aria-label="studio render scene">
      <img src="./rail_robot_scene_guide.svg" alt="Minimal studio style Indy7 robot and rail scene">
    </section>

    <header class="bar">
      <div class="brand">
        <strong>INDY7 Studio View</strong>
        <span>회색 테이블, 흰색 로봇, 작업물 중심의 깨끗한 Simple View</span>
      </div>
      <nav class="pills" aria-label="view layers">
        <span class="pill on">Robot</span>
        <span class="pill on">Rail</span>
        <span class="pill on">Workpiece</span>
        <span class="pill">Trace</span>
        <span class="pill">Zone</span>
      </nav>
    </header>

    <aside class="caption">
      Debug layer는 기본 숨김. 실제 적용 시 Robot A/B/C 선택에 따라 같은 구도로 로봇과 TCP만 갱신.
    </aside>
  </main>
</body>
</html>
