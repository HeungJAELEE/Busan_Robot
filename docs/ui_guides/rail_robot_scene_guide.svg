<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Indy7 Rail Robot Clean Scene Guide</title>
  <desc id="desc">A clean HMI guide view that keeps only the rail, three Indy7 robots, key distances, and minimal status panels.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171f"/>
      <stop offset="1" stop-color="#101018"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3d40"/>
      <stop offset="1" stop-color="#222427"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9b0b3"/>
      <stop offset="0.5" stop-color="#e1e5e4"/>
      <stop offset="1" stop-color="#8a9298"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="slotPattern" width="42" height="16" patternUnits="userSpaceOnUse">
      <rect width="42" height="16" fill="#c9cecf"/>
      <rect y="6" width="42" height="3" fill="#7c858a" opacity="0.55"/>
    </pattern>
    <style>
      .bg { fill: #07070d; }
      .panel { fill: url(#panel); stroke: #282836; stroke-width: 1.5; }
      .panel-soft { fill: #11111a; stroke: #252535; stroke-width: 1.2; }
      .headline { font: 800 34px Inter, Pretendard, Arial, sans-serif; fill: #f3f4f7; letter-spacing: 0; }
      .sub { font: 600 15px Inter, Pretendard, Arial, sans-serif; fill: #aab0bd; letter-spacing: 0; }
      .label { font: 700 17px Inter, Pretendard, Arial, sans-serif; fill: #eceff5; letter-spacing: 0; }
      .small { font: 600 13px Inter, Pretendard, Arial, sans-serif; fill: #9ca3af; letter-spacing: 0; }
      .tiny { font: 600 11px Inter, Pretendard, Arial, sans-serif; fill: #8a91a0; letter-spacing: 0; }
      .dim { font: 700 14px Inter, Pretendard, Arial, sans-serif; fill: #d7dbe3; letter-spacing: 0; }
      .robot-shell { fill: #f8fafc; stroke: #e3e8ef; stroke-width: 3; }
      .robot-link { fill: none; stroke: #f8fafc; stroke-width: 34; stroke-linecap: round; stroke-linejoin: round; }
      .robot-link-shadow { fill: none; stroke: #06060a; stroke-width: 42; stroke-linecap: round; stroke-linejoin: round; opacity: 0.22; }
      .joint { fill: #ffffff; stroke-width: 5; }
      .table-edge { stroke: #60676d; stroke-width: 3; opacity: 0.62; }
      .deck-slot { stroke: #777f84; stroke-width: 2; opacity: 0.42; }
      .dim-line { stroke: #f1b45d; stroke-width: 2.2; stroke-dasharray: 8 7; fill: none; opacity: 0.82; }
      .dim-post { stroke: #f1b45d; stroke-width: 2; opacity: 0.7; }
      .chip { fill: #202535; stroke: #33394c; stroke-width: 1; }
      .chip-on { fill: #1f3a33; stroke: #3f8f6b; stroke-width: 1; }
      .chip-warn { fill: #3a3020; stroke: #b37c33; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <g opacity="0.18">
    <path d="M80 130 H1135 M80 210 H1135 M80 290 H1135 M80 370 H1135 M80 450 H1135 M80 530 H1135 M80 610 H1135 M80 690 H1135 M80 770 H1135" stroke="#4b5563"/>
    <path d="M120 110 V800 M245 110 V800 M370 110 V800 M495 110 V800 M620 110 V800 M745 110 V800 M870 110 V800 M995 110 V800 M1120 110 V800" stroke="#4b5563"/>
  </g>

  <rect x="34" y="28" width="1532" height="72" rx="18" class="panel"/>
  <text x="62" y="74" class="headline">INDY7 Rail Robot View</text>
  <text x="439" y="72" class="sub">현장 사진 기준 단순화 화면안: 레일, 로봇, 핵심 치수만 표시</text>
  <g transform="translate(1196 47)">
    <rect width="118" height="34" rx="17" class="chip-on"/>
    <circle cx="22" cy="17" r="7" fill="#5fd18a"/>
    <text x="39" y="22" class="small" fill="#dff7e8">Rail Only</text>
  </g>
  <g transform="translate(1328 47)">
    <rect width="105" height="34" rx="17" class="chip"/>
    <circle cx="22" cy="17" r="7" fill="#71b7ff"/>
    <text x="39" y="22" class="small">Live TCP</text>
  </g>
  <g transform="translate(1446 47)">
    <rect width="84" height="34" rx="17" class="chip-warn"/>
    <text x="18" y="22" class="small" fill="#ffdca8">Zones off</text>
  </g>

  <rect x="34" y="122" width="1128" height="740" rx="24" class="panel" filter="url(#softShadow)"/>
  <rect x="84" y="196" width="1018" height="498" rx="22" fill="#181a1f" stroke="#343842" stroke-width="2"/>

  <!-- simplified aluminum table deck -->
  <g transform="translate(108 472)">
    <path d="M0 0 H950 L1016 126 H66 Z" fill="url(#deck)" stroke="#626a70" stroke-width="3"/>
    <path d="M68 24 H906 M82 50 H920 M96 76 H934 M110 102 H948" class="deck-slot"/>
    <path d="M122 0 L188 126 M256 0 L322 126 M390 0 L456 126 M524 0 L590 126 M658 0 L724 126 M792 0 L858 126" class="deck-slot"/>
    <path d="M0 0 H950" class="table-edge"/>
    <path d="M66 126 H1016" class="table-edge"/>
  </g>

  <!-- front rail and carrier line -->
  <g transform="translate(98 648)">
    <rect x="0" y="0" width="1016" height="42" rx="10" fill="url(#rail)" stroke="#f0f4f4" stroke-width="1.5"/>
    <rect x="30" y="10" width="956" height="22" rx="7" fill="#2e3337"/>
    <rect x="42" y="15" width="932" height="12" rx="5" fill="#121417"/>
    <rect x="0" y="-18" width="1016" height="12" rx="6" fill="url(#slotPattern)" opacity="0.85"/>
    <rect x="0" y="48" width="1016" height="12" rx="6" fill="url(#slotPattern)" opacity="0.85"/>
    <text x="430" y="91" class="dim">Front rail / conveyor guide</text>
  </g>

  <!-- guide markers on rail -->
  <g opacity="0.9">
    <rect x="185" y="617" width="46" height="76" rx="8" fill="#f3c653" stroke="#ffe39b" stroke-width="2"/>
    <rect x="546" y="617" width="46" height="76" rx="8" fill="#f3c653" stroke="#ffe39b" stroke-width="2"/>
    <rect x="907" y="617" width="46" height="76" rx="8" fill="#f3c653" stroke="#ffe39b" stroke-width="2"/>
  </g>

  <!-- dimension lines -->
  <g>
    <path d="M318 435 V585" class="dim-post"/>
    <path d="M653 435 V585" class="dim-post"/>
    <path d="M988 435 V585" class="dim-post"/>
    <path d="M318 454 H653" class="dim-line"/>
    <path d="M653 454 H988" class="dim-line"/>
    <text x="449" y="438" class="dim">1850 mm</text>
    <text x="784" y="438" class="dim">1850 mm</text>
    <path d="M318 566 H318 M318 566 V650" class="dim-line"/>
    <text x="248" y="560" class="dim">Rail gap 500 mm</text>
    <path d="M110 720 H318" class="dim-line"/>
    <text x="142" y="746" class="dim">A rail end 1000 mm</text>
  </g>

  <!-- Robot A -->
  <g transform="translate(318 424)">
    <ellipse cx="0" cy="165" rx="70" ry="26" fill="#050508" opacity="0.35"/>
    <circle cx="0" cy="120" r="50" fill="#f6f8fb" stroke="#d6dde7" stroke-width="4"/>
    <circle cx="0" cy="120" r="33" fill="#dfe6ed"/>
    <path d="M0 115 C-26 60 -18 8 10 -32" class="robot-link-shadow"/>
    <path d="M0 115 C-26 60 -18 8 10 -32" class="robot-link"/>
    <circle cx="0" cy="115" r="22" class="joint" stroke="#61b6ff"/>
    <circle cx="10" cy="-32" r="22" class="joint" stroke="#61b6ff"/>
    <path d="M10 -32 C64 -66 96 -40 108 8" class="robot-link-shadow"/>
    <path d="M10 -32 C64 -66 96 -40 108 8" class="robot-link"/>
    <circle cx="108" cy="8" r="20" class="joint" stroke="#61b6ff"/>
    <path d="M108 8 C82 58 78 96 104 130" class="robot-link-shadow"/>
    <path d="M108 8 C82 58 78 96 104 130" class="robot-link"/>
    <circle cx="104" cy="130" r="18" class="joint" stroke="#61b6ff"/>
    <rect x="62" y="136" width="86" height="15" rx="7" fill="#1e9cff" opacity="0.85"/>
    <text x="-48" y="210" class="label">Robot A</text>
    <circle cx="-46" cy="79" r="7" fill="#5fd18a"/>
  </g>

  <!-- Robot B -->
  <g transform="translate(653 424)">
    <ellipse cx="0" cy="165" rx="70" ry="26" fill="#050508" opacity="0.35"/>
    <circle cx="0" cy="120" r="50" fill="#f6f8fb" stroke="#d6dde7" stroke-width="4"/>
    <circle cx="0" cy="120" r="33" fill="#dfe6ed"/>
    <path d="M0 115 C14 60 -2 7 -39 -32" class="robot-link-shadow"/>
    <path d="M0 115 C14 60 -2 7 -39 -32" class="robot-link"/>
    <circle cx="0" cy="115" r="22" class="joint" stroke="#63d993"/>
    <circle cx="-39" cy="-32" r="22" class="joint" stroke="#63d993"/>
    <path d="M-39 -32 C-3 -82 57 -77 88 -34" class="robot-link-shadow"/>
    <path d="M-39 -32 C-3 -82 57 -77 88 -34" class="robot-link"/>
    <circle cx="88" cy="-34" r="20" class="joint" stroke="#63d993"/>
    <path d="M88 -34 C54 28 42 80 70 126" class="robot-link-shadow"/>
    <path d="M88 -34 C54 28 42 80 70 126" class="robot-link"/>
    <circle cx="70" cy="126" r="18" class="joint" stroke="#63d993"/>
    <rect x="30" y="134" width="86" height="15" rx="7" fill="#42c873" opacity="0.86"/>
    <text x="-48" y="210" class="label">Robot B</text>
    <circle cx="-46" cy="79" r="7" fill="#5fd18a"/>
  </g>

  <!-- Robot C -->
  <g transform="translate(988 424)">
    <ellipse cx="0" cy="165" rx="70" ry="26" fill="#050508" opacity="0.35"/>
    <circle cx="0" cy="120" r="50" fill="#f6f8fb" stroke="#d6dde7" stroke-width="4"/>
    <circle cx="0" cy="120" r="33" fill="#dfe6ed"/>
    <path d="M0 115 C26 58 18 6 -12 -36" class="robot-link-shadow"/>
    <path d="M0 115 C26 58 18 6 -12 -36" class="robot-link"/>
    <circle cx="0" cy="115" r="22" class="joint" stroke="#ff8b81"/>
    <circle cx="-12" cy="-36" r="22" class="joint" stroke="#ff8b81"/>
    <path d="M-12 -36 C-68 -60 -102 -30 -112 20" class="robot-link-shadow"/>
    <path d="M-12 -36 C-68 -60 -102 -30 -112 20" class="robot-link"/>
    <circle cx="-112" cy="20" r="20" class="joint" stroke="#ff8b81"/>
    <path d="M-112 20 C-88 60 -76 96 -106 132" class="robot-link-shadow"/>
    <path d="M-112 20 C-88 60 -76 96 -106 132" class="robot-link"/>
    <circle cx="-106" cy="132" r="18" class="joint" stroke="#ff8b81"/>
    <rect x="-149" y="137" width="86" height="15" rx="7" fill="#ff6f61" opacity="0.86"/>
    <text x="-48" y="210" class="label">Robot C</text>
    <circle cx="-46" cy="79" r="7" fill="#5fd18a"/>
  </g>

  <!-- subtle TCP path sample, off by default but visible as ghost -->
  <g opacity="0.28">
    <path d="M426 554 C520 516 616 535 723 564 C818 590 887 575 988 548" fill="none" stroke="#8ccaff" stroke-width="3" stroke-dasharray="10 10"/>
    <circle cx="426" cy="554" r="7" fill="#8ccaff"/>
    <circle cx="723" cy="564" r="7" fill="#8ccaff"/>
    <circle cx="988" cy="548" r="7" fill="#8ccaff"/>
  </g>

  <rect x="84" y="724" width="1018" height="94" rx="18" class="panel-soft"/>
  <text x="112" y="758" class="label">View rule</text>
  <text x="112" y="786" class="small">기본 화면은 레일, 로봇 3대, TCP 현재점, 핵심 치수만 표시합니다. 위험 존/궤적/그리드는 작업자가 켤 때만 얇게 표시합니다.</text>
  <text x="112" y="812" class="small">실제 Indy7 모델링 파일은 Drive 원본을 로컬에 받은 뒤 이 단순 링크 형상 대신 mesh layer로 교체합니다.</text>

  <!-- right guide panel -->
  <rect x="1190" y="122" width="376" height="740" rx="24" class="panel" filter="url(#softShadow)"/>
  <text x="1222" y="174" class="headline" font-size="27">Guide UI</text>
  <text x="1222" y="202" class="sub">작업자용 단순 뷰 제안</text>

  <g transform="translate(1222 246)">
    <text class="label" x="0" y="0">표시 레이어</text>
    <g transform="translate(0 26)">
      <rect width="300" height="42" rx="12" class="chip-on"/>
      <circle cx="24" cy="21" r="8" fill="#5fd18a"/>
      <text x="47" y="27" class="small" fill="#e7fff0">레일 / 컨베이어</text>
    </g>
    <g transform="translate(0 78)">
      <rect width="300" height="42" rx="12" class="chip-on"/>
      <circle cx="24" cy="21" r="8" fill="#61b6ff"/>
      <text x="47" y="27" class="small" fill="#e7fff0">Robot A/B/C 단순 모델</text>
    </g>
    <g transform="translate(0 130)">
      <rect width="300" height="42" rx="12" class="chip"/>
      <circle cx="24" cy="21" r="8" fill="#8ccaff" opacity="0.5"/>
      <text x="47" y="27" class="small">TCP 궤적: 기본 OFF</text>
    </g>
    <g transform="translate(0 182)">
      <rect width="300" height="42" rx="12" class="chip-warn"/>
      <circle cx="24" cy="21" r="8" fill="#f1b45d" opacity="0.6"/>
      <text x="47" y="27" class="small" fill="#ffdca8">안전 존: 필요 시만 ON</text>
    </g>
  </g>

  <g transform="translate(1222 518)">
    <text class="label" x="0" y="0">현장 치수 기준</text>
    <rect x="0" y="24" width="300" height="152" rx="14" fill="#0c0c13" stroke="#282838"/>
    <text x="22" y="60" class="small">Robot 간격: 1850 mm</text>
    <text x="22" y="92" class="small">로봇 전면 rail 거리: 500 mm</text>
    <text x="22" y="124" class="small">Robot A → rail 끝단: 1000 mm</text>
    <text x="22" y="156" class="small">Place 감시 존은 숨김 상태로 시작</text>
  </g>

  <g transform="translate(1222 735)">
    <rect width="300" height="74" rx="15" fill="#101824" stroke="#254265"/>
    <text x="18" y="30" class="label" fill="#cfe6ff">다음 적용 방향</text>
    <text x="18" y="56" class="tiny">1. Drive mesh 확인 → 2. Simple/Debug 모드 분리 → 3. 실제 앱 반영</text>
  </g>
</svg>
