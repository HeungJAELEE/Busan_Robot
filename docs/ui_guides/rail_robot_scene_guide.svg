<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Indy7 Minimal Studio Render Guide</title>
  <desc id="desc">A clean studio-style digital twin guide with a white Indy7 robot, grey rail table, and simple colored workpieces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7d7d4"/>
      <stop offset="0.52" stop-color="#bfc0bc"/>
      <stop offset="1" stop-color="#8f928e"/>
    </linearGradient>
    <radialGradient id="spot" cx="46%" cy="20%" r="72%">
      <stop offset="0" stop-color="#f5f5f2" stop-opacity="0.95"/>
      <stop offset="0.48" stop-color="#d5d5d1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#80837f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b9d99"/>
      <stop offset="0.5" stop-color="#777a76"/>
      <stop offset="1" stop-color="#5f625e"/>
    </linearGradient>
    <linearGradient id="floorEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9cbc8"/>
      <stop offset="1" stop-color="#6b6e6a"/>
    </linearGradient>
    <linearGradient id="robotWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#f1f3f2"/>
      <stop offset="0.58" stop-color="#d5d9d9"/>
      <stop offset="1" stop-color="#a7adad"/>
    </linearGradient>
    <linearGradient id="robotSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfefe"/>
      <stop offset="0.46" stop-color="#e5e9e8"/>
      <stop offset="1" stop-color="#b8bdbc"/>
    </linearGradient>
    <linearGradient id="jointDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#626866"/>
      <stop offset="0.55" stop-color="#222827"/>
      <stop offset="1" stop-color="#0d1111"/>
    </linearGradient>
    <linearGradient id="railMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a6f6d"/>
      <stop offset="0.24" stop-color="#d7dad7"/>
      <stop offset="0.52" stop-color="#8e9491"/>
      <stop offset="0.78" stop-color="#eef0ee"/>
      <stop offset="1" stop-color="#5c615f"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#20201e" flood-opacity="0.42"/>
    </filter>
    <filter id="softShadow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#222220" flood-opacity="0.32"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 800 33px Inter, Pretendard, Arial, sans-serif; fill: #1f2424; letter-spacing: 0; }
      .sub { font: 650 14px Inter, Pretendard, Arial, sans-serif; fill: #4f5756; letter-spacing: 0; }
      .tiny { font: 750 12px Inter, Pretendard, Arial, sans-serif; fill: #5b6261; letter-spacing: 0; }
      .label { font: 800 14px Inter, Pretendard, Arial, sans-serif; fill: #242928; letter-spacing: 0; }
      .robot-link { fill: none; stroke: url(#robotWhite); stroke-linecap: round; stroke-linejoin: round; filter: url(#shadow); }
      .robot-link-hi { fill: none; stroke: #ffffff; stroke-linecap: round; stroke-linejoin: round; opacity: 0.55; }
      .joint { fill: url(#robotWhite); stroke: #6f7776; stroke-width: 3; filter: url(#softShadow); }
      .joint-cap { fill: url(#jointDark); stroke: #d8dcda; stroke-width: 5; filter: url(#softShadow); }
      .rail-line { stroke: #f2f3f1; stroke-width: 3; opacity: 0.72; }
      .slot { stroke: #4f5553; stroke-width: 3; opacity: 0.36; }
      .measure { stroke: #ffd445; stroke-width: 3; stroke-dasharray: 10 10; fill: none; opacity: 0.72; }
      .pill { fill: rgba(255,255,255,0.44); stroke: rgba(60,68,66,0.16); stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#spot)"/>

  <!-- minimal top UI -->
  <g transform="translate(46 42)">
    <text x="0" y="0" class="title">INDY7 Studio View</text>
    <text x="2" y="31" class="sub">Simple rail + robot preview, debug layers hidden</text>
  </g>
  <g transform="translate(1138 40)">
    <rect x="0" y="0" width="376" height="52" rx="26" class="pill"/>
    <circle cx="34" cy="26" r="8" fill="#39c978"/>
    <text x="54" y="31" class="tiny">Rail</text>
    <circle cx="122" cy="26" r="8" fill="#39c978"/>
    <text x="142" y="31" class="tiny">Robot</text>
    <circle cx="226" cy="26" r="8" fill="#b9bdbc"/>
    <text x="246" y="31" class="tiny">Trace off</text>
  </g>

  <!-- tabletop / rail plane -->
  <g filter="url(#shadow)">
    <path d="M112 568 L1188 418 L1520 602 L420 812 Z" fill="url(#floor)" stroke="#cbceca" stroke-width="4"/>
    <path d="M112 568 L1188 418 L1520 602" fill="none" stroke="#d9dcda" stroke-width="4" opacity="0.65"/>
    <path d="M420 812 L1520 602" fill="none" stroke="#3f4543" stroke-width="4" opacity="0.4"/>
    <path d="M206 594 L1162 465 L1385 589 L415 766 Z" fill="#464b49" opacity="0.34"/>
    <path d="M278 610 L1194 482" class="rail-line"/>
    <path d="M396 767 L1398 588" class="rail-line"/>
    <path d="M340 615 L1288 495 M420 642 L1368 524 M500 668 L1448 553 M580 694 L1528 582" class="slot"/>
  </g>

  <!-- simple rail sled and target zone -->
  <g filter="url(#softShadow)">
    <path d="M526 604 L818 562 L922 620 L626 674 Z" fill="#2c3130" stroke="#c9ceca" stroke-width="3"/>
    <path d="M580 606 L786 578 M624 630 L830 602 M668 654 L874 626" stroke="#8d9692" stroke-width="3" opacity="0.62"/>
    <path d="M916 625 L1116 588 L1226 649 L1018 694 Z" fill="#353a38" stroke="#c9ceca" stroke-width="3"/>
  </g>

  <!-- colored parts, close to reference mood -->
  <g filter="url(#softShadow)">
    <g transform="translate(880 496)">
      <path d="M0 0 C0 -15 74 -15 74 0 L74 150 C74 165 0 165 0 150 Z" fill="#e6322e"/>
      <ellipse cx="37" cy="0" rx="37" ry="14" fill="#ff6259"/>
      <path d="M0 48 C0 33 74 33 74 48 L74 100 C74 115 0 115 0 100 Z" fill="#22c95d"/>
      <ellipse cx="37" cy="48" rx="37" ry="14" fill="#54ee82"/>
      <path d="M0 99 C0 84 74 84 74 99 L74 150 C74 165 0 165 0 150 Z" fill="#f7d21f"/>
      <ellipse cx="37" cy="99" rx="37" ry="14" fill="#ffe765"/>
      <ellipse cx="37" cy="150" rx="37" ry="14" fill="#b12d21" opacity="0.62"/>
    </g>
    <g transform="translate(1050 592)">
      <path d="M0 0 L70 -12 L70 82 L0 98 Z" fill="#ffdf27"/>
      <path d="M70 -12 L102 7 L102 98 L70 82 Z" fill="#c5a717"/>
      <path d="M0 0 L70 -12 L102 7 L32 23 Z" fill="#fff269"/>
    </g>
    <g transform="translate(1192 642)">
      <path d="M0 0 L72 -14 L72 66 L0 82 Z" fill="#14d7de"/>
      <path d="M72 -14 L110 8 L110 86 L72 66 Z" fill="#0a8fb5"/>
      <path d="M0 0 L72 -14 L110 8 L38 24 Z" fill="#6ef7ff"/>
    </g>
    <g transform="translate(1322 601)">
      <path d="M0 0 L72 -12 L72 72 L0 88 Z" fill="#1934e8"/>
      <path d="M72 -12 L106 8 L106 92 L72 72 Z" fill="#111a89"/>
      <path d="M0 0 L72 -12 L106 8 L34 23 Z" fill="#5164ff"/>
    </g>
  </g>

  <!-- main white Indy7 robot, clean studio style -->
  <g transform="translate(426 548)" filter="url(#shadow)">
    <!-- base -->
    <ellipse cx="0" cy="172" rx="144" ry="32" fill="#2b2f2e" opacity="0.22"/>
    <path d="M-92 112 C-82 82 82 82 92 112 L70 184 C60 210 -60 210 -70 184 Z" fill="url(#robotSoft)" stroke="#777f7d" stroke-width="4"/>
    <ellipse cx="0" cy="110" rx="94" ry="38" fill="url(#robotWhite)" stroke="#777f7d" stroke-width="4"/>
    <ellipse cx="0" cy="106" rx="58" ry="22" fill="#e9eceb" opacity="0.82"/>

    <!-- vertical shoulder and elbow -->
    <path class="robot-link" d="M-18 86 C-70 -4 -48 -132 36 -202" stroke-width="70"/>
    <path class="robot-link-hi" d="M-35 58 C-68 -26 -38 -126 42 -192" stroke-width="13"/>
    <circle class="joint" cx="-18" cy="86" r="44"/>
    <circle class="joint" cx="36" cy="-202" r="50"/>

    <!-- upper arm -->
    <path class="robot-link" d="M36 -202 C160 -286 310 -198 362 -48" stroke-width="64"/>
    <path class="robot-link-hi" d="M61 -218 C176 -264 288 -192 338 -62" stroke-width="12"/>
    <circle class="joint" cx="362" cy="-48" r="46"/>
    <circle class="joint-cap" cx="362" cy="-48" r="31"/>
    <circle cx="362" cy="-48" r="12" fill="#bfc5c3"/>

    <!-- forearm and wrist -->
    <path class="robot-link" d="M362 -48 C318 58 360 148 486 178" stroke-width="54"/>
    <path class="robot-link-hi" d="M356 -22 C334 68 372 133 476 164" stroke-width="10"/>
    <circle class="joint" cx="486" cy="178" r="38"/>
    <circle class="joint-cap" cx="486" cy="178" r="23"/>
    <path class="robot-link" d="M486 178 C546 188 585 222 596 278" stroke-width="38"/>
    <circle class="joint" cx="596" cy="278" r="29"/>

    <!-- tool / gripper -->
    <g transform="translate(596 278) rotate(12)">
      <rect x="-17" y="16" width="34" height="52" rx="12" fill="url(#robotWhite)" stroke="#6f7776" stroke-width="3"/>
      <rect x="-34" y="62" width="68" height="24" rx="8" fill="#d7dcda" stroke="#626a68" stroke-width="3"/>
      <path d="M-24 84 L-54 122" stroke="#434a48" stroke-width="10" stroke-linecap="round"/>
      <path d="M24 84 L52 122" stroke="#434a48" stroke-width="10" stroke-linecap="round"/>
      <path d="M-55 122 L-73 112 M53 122 L72 112" stroke="#1f2524" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- cable -->
    <path d="M-40 68 C-124 -4 -114 -152 20 -248 C70 -285 118 -296 170 -276" fill="none" stroke="#202524" stroke-width="15" stroke-linecap="round" opacity="0.86"/>
  </g>

  <!-- TCP guide glow -->
  <g opacity="0.95">
    <path d="M1016 690 C1004 632 978 584 916 548" class="measure"/>
    <circle cx="916" cy="548" r="9" fill="#48ec7d" filter="url(#glow)"/>
    <circle cx="1016" cy="690" r="9" fill="#48ec7d" filter="url(#glow)"/>
    <text x="938" y="534" class="label">TCP target</text>
  </g>

  <!-- quiet dimension callouts -->
  <g opacity="0.78">
    <path d="M196 786 L414 744" class="measure"/>
    <text x="216" y="816" class="tiny">Robot A rail end 1000mm</text>
    <path d="M1160 708 L1338 672" class="measure"/>
    <text x="1186" y="744" class="tiny">front rail 500mm</text>
  </g>

  <!-- small bottom status bar -->
  <g transform="translate(50 808)">
    <rect x="0" y="0" width="520" height="54" rx="27" fill="#ffffff" opacity="0.42" stroke="#ffffff" stroke-opacity="0.26"/>
    <text x="24" y="34" class="tiny">Simple View: rail, robot, workpiece only</text>
    <circle cx="326" cy="27" r="7" fill="#38c876"/>
    <text x="344" y="34" class="tiny">Robot A selected</text>
  </g>
</svg>
