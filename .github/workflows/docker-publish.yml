name: Publish Docker Images

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
      - "backend/**"
      - "frontend/indy_utils/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Extra image tag to publish"
        required: false
        default: "manual"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: heungjaelee

jobs:
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: robot-controller
            dockerfile: backend/docker/robot_controller.Dockerfile
          - image: db-worker
            dockerfile: backend/docker/db_worker.Dockerfile
          - image: digital-twin
            dockerfile: backend/docker/digital_twin.Dockerfile
          - image: plc-bridge
            dockerfile: backend/docker/plc_bridge.Dockerfile
          - image: vision-yolo
            dockerfile: backend/docker/vision_yolo.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/indy7-hmi-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
