version: '3.8'

services:
  # 1. 로봇 컨트롤러 (Robot Controller)
  # 역할: IndyDCP 소켓 통신을 전담하며, 로봇의 실시간 상태를 읽고 모션 명령을 내립니다.
  # 통신: 외부 모듈(HMI 등)과는 MQTT나 REST API/Redis를 통해 명령을 주고받습니다.
  robot_controller:
    build: 
      context: .
      dockerfile: docker/robot_controller.Dockerfile
    container_name: indy7_robot_controller
    network_mode: "host" # 로봇과 직접 소켓 통신을 위해 호스트 네트워크 사용 권장
    environment:
      - ROBOT_IP=192.168.3.11 # (예시) 실제 로봇 IP
    restart: always

  # 2. 디지털 트윈 (Digital Twin)
  # 역할: 로봇의 조인트 각도 스트림을 받아 3D 렌더링 엔진이나 웹브라우저로 스트리밍.
  digital_twin:
    build:
      context: .
      dockerfile: docker/digital_twin.Dockerfile
    container_name: indy7_digital_twin
    ports:
      - "8080:8080" # 3D 뷰어 웹 포트
    depends_on:
      - robot_controller

  # 3. 비전/카메라 분석 (YOLO Camera)
  # 역할: 카메라 장치 접근, 영상 스트리밍 및 YOLO 추론 스레드 전담 (GPU 사용).
  vision_yolo:
    build:
      context: .
      dockerfile: docker/vision_yolo.Dockerfile
    container_name: indy7_vision_yolo
    # GPU 패스스루 설정 (Nvidia Docker 기준)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    devices:
      - "/dev/video0:/dev/video0" # 로컬 USB 웹캠 연결 시
    ports:
      - "5000:5000" # 영상 스트리밍 포트
    restart: always

  # 4. PLC 연동 (PLC Integration)
  # 역할: MC Protocol, Modbus 등으로 미쓰비시/LS PLC와 통신. 센서 데이터를 읽고 로봇 모듈로 전달.
  plc_bridge:
    build:
      context: .
      dockerfile: docker/plc_bridge.Dockerfile
    container_name: indy7_plc_bridge
    network_mode: "host" # 공장 내부 망(PLC) 대역 접근용
    environment:
      - PLC_IP=192.168.3.39
    restart: on-failure

  # 5. 중앙 통신 브로커 (Communication - MQTT/Redis)
  # 역할: 위 6개의 독립된 모듈이 서로 데이터를 주고받을 수 있도록 해주는 우체국.
  message_broker:
    image: eclipse-mosquitto:latest
    container_name: indy7_mqtt_broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config
      - ./docker/mosquitto/data:/mosquitto/data
    restart: always

  # 6. DB 연동 스케줄러 (MES DB Integration)
  # 역할: 메세지 브로커를 구독하며 수집된 데이터를 MySQL(192.168.3.45)에 적재. (커넥션 풀 관리)
  db_worker:
    build:
      context: .
      dockerfile: docker/db_worker.Dockerfile
    container_name: indy7_db_worker
    environment:
      - DB_HOST=192.168.3.45
      - DB_USER=guest
      - DB_PASS=guest1234
      - DB_NAME=faictory_mes
      - MQTT_BROKER=message_broker
    depends_on:
      - message_broker
    restart: always
